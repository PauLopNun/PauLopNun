name: Generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#764ba2&color_dots=#ebedf0,#c7c9f2,#a3a5ea,#7f81df,#667eea
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#764ba2&color_dots=#161b22,#2b2f6b,#3f4396,#5458c2,#667eea

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
