name: Generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#3b2466&color_dots=#ebedf0,#cdd3f8,#9da6ee,#7b6ad4,#764ba2
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#e2d2ff&color_dots=#161b22,#2b2f6b,#43449a,#6a5fd0,#9f7aea

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
